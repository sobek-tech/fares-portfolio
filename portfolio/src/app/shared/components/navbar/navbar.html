<header class="navbar">
  <div class="shell navbar__inner">
    <a class="navbar__brand" href="#home" (click)="closeMenu()" aria-label="Fares Elsobky, home">
      FE<span>.</span>
    </a>

    <button
      class="navbar__toggle"
      type="button"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-navigation"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav
      class="navbar__nav"
      id="primary-navigation"
      aria-label="Primary navigation"
      [class.navbar__nav--open]="menuOpen()"
    >
      @for (item of navigation; track item.href) {
        <a [href]="item.href" (click)="closeMenu()">{{ item.label }}</a>
      }
      <a class="navbar__resume" href="CV.pdf" download="Fares-Elsobky-CV.pdf">
        Download CV
      </a>
    </nav>
  </div>
</header>
